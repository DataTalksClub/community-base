name: Cross-repo consumer check

# Runs the real test suite of both site consumers (DataTalksClub/website and
# AI-Shipping-Labs/website) against the in-progress state of this package,
# using each site's own P1 local-development link tool
# (scripts/community_base_link.py / `make core-link`) instead of a tagged
# release.
#
# D1 (docs/01-decisions.md) frames a local/path package source as
# development-only, and the D0.2 site guards
# (`scripts/check_community_base_source.py` in DataTalksClub/website; the
# same guard is planned but not yet built for AI-Shipping-Labs, see
# docs/plan/phase-0.md D0.2) fail closed against exactly that source in each
# site's own required CI. D15 (docs/01-decisions.md), owner-confirmed
# 2026-09-16 (issue C0.6, docs/plan/phase-0.md), scopes a narrow exception to
# D1 for this one job only: this package's own CI may use the local-link
# override against a disposable checkout of each site, on every push and
# pull request here, so a break is caught against each site's latest default
# branch promptly rather than up to a week later. D0.2 is unchanged — each
# site's own CI, and every site pull request, still fail closed against a
# local/path/branch source; nothing here is committed or pushed to a site
# repository. Note: this workflow reporting failure does not by itself make
# it a required GitHub branch-protection check on this repository's pull
# requests; that is a separate repository-settings change.
#
# Verdict: each job runs the site suite twice in the same disposable
# checkout — once against the site's own pinned package release
# (the baseline) and once against the in-progress package — and fails only
# when the linked run has failures the baseline run does not. A site whose
# default branch already fails tests on its own pin (its own process owns
# that redness) stays visible in the job log without permanently red runs
# here, while a package change that breaks a consumer still fails the job.
# The comparison artifacts (suite logs and failure sets) are written to the
# workflow workspace root, outside both site checkouts: sites scan their
# untracked files in tests (for example DataTalksClub's cadmin reference
# allowlist walks `git ls-files --others`), and a stray log inside the
# checkout would fail those scanners asymmetrically.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      dtc_website_ref:
        description: "DataTalksClub/website ref to check out (default: its default branch)"
        required: false
        type: string
      ai_shipping_labs_ref:
        description: "AI-Shipping-Labs/website ref to check out (default: its default branch)"
        required: false
        type: string

jobs:
  dtc-website:
    name: "DataTalksClub/website: real test suite against this package"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out community-base (the change under test)
        uses: actions/checkout@v4
        with:
          path: community-base

      - name: Check out DataTalksClub/website
        uses: actions/checkout@v4
        with:
          repository: DataTalksClub/website
          ref: ${{ inputs.dtc_website_ref || '' }}
          path: dtc-website

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Django checks against the pinned baseline
        working-directory: dtc-website
        run: uv run python scripts/ci.py django-check

      - name: Baseline test suite with the pinned package
        # Expected to fail whenever the site's default branch is already red
        # on its own pin; the verdict step below decides, not this step.
        working-directory: dtc-website
        continue-on-error: true
        run: |
          set -o pipefail
          uv run python scripts/ci.py test-django-full 2>&1 | tee "$GITHUB_WORKSPACE/baseline-suite.log"

      - name: Record the baseline failure set
        working-directory: dtc-website
        if: always()
        run: |
          { grep -E "^(FAIL|ERROR): " "$GITHUB_WORKSPACE/baseline-suite.log" || true; } | sed -E 's/ \(.*//' | sort -u > "$GITHUB_WORKSPACE/baseline-failures.txt"
          echo "Baseline failures: $(wc -l < "$GITHUB_WORKSPACE/baseline-failures.txt")"

      - name: Link the in-progress package (dtc-website playbook P1)
        working-directory: dtc-website
        run: uv run python scripts/community_base_link.py link

      - name: Django checks against the in-progress package
        working-directory: dtc-website
        run: uv run python scripts/ci.py django-check

      - name: Test suite against the in-progress package
        working-directory: dtc-website
        continue-on-error: true
        run: |
          set -o pipefail
          uv run python scripts/ci.py test-django-full 2>&1 | tee "$GITHUB_WORKSPACE/linked-suite.log"

      - name: Record the linked failure set
        working-directory: dtc-website
        if: always()
        run: |
          { grep -E "^(FAIL|ERROR): " "$GITHUB_WORKSPACE/linked-suite.log" || true; } | sed -E 's/ \(.*//' | sort -u > "$GITHUB_WORKSPACE/linked-failures.txt"
          echo "Linked failures: $(wc -l < "$GITHUB_WORKSPACE/linked-failures.txt")"

      - name: Verdict — the in-progress package adds no new failures
        working-directory: dtc-website
        run: |
          comm -13 "$GITHUB_WORKSPACE/baseline-failures.txt" "$GITHUB_WORKSPACE/linked-failures.txt" > "$GITHUB_WORKSPACE/new-failures.txt" || true
          if [ -s "$GITHUB_WORKSPACE/new-failures.txt" ]; then
            echo "The in-progress package introduces failures the site does not have on its own pin:"
            cat "$GITHUB_WORKSPACE/new-failures.txt"
            exit 1
          fi
          echo "No new failures beyond the site's pinned baseline."

      - name: Restore the pinned dependency
        if: always()
        working-directory: dtc-website
        run: uv run python scripts/community_base_link.py unlink

  ai-shipping-labs:
    name: "AI-Shipping-Labs/website: real test suite against this package"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SECRET_KEY: "cross-repo-check-only-not-a-real-secret"
    steps:
      - name: Check out community-base (the change under test)
        uses: actions/checkout@v4
        with:
          path: community-base

      - name: Check out AI-Shipping-Labs/website
        uses: actions/checkout@v4
        with:
          repository: AI-Shipping-Labs/website
          ref: ${{ inputs.ai_shipping_labs_ref || '' }}
          path: ai-shipping-labs

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ai-shipping-labs/package-lock.json

      - name: Build the static bundle (site Makefile css-build)
        # The site's own CI builds CSS before testing; the Tailwind source
        # contract test reads the compiled bundle from the checkout.
        working-directory: ai-shipping-labs
        run: make css-build

      - name: System checks against the pinned baseline
        working-directory: ai-shipping-labs
        run: uv run python manage.py check

      - name: Baseline test suite with the pinned package
        working-directory: ai-shipping-labs
        continue-on-error: true
        run: |
          set -o pipefail
          make test 2>&1 | tee "$GITHUB_WORKSPACE/baseline-suite.log"

      - name: Record the baseline failure set
        working-directory: ai-shipping-labs
        if: always()
        run: |
          { grep -E "^(FAIL|ERROR): " "$GITHUB_WORKSPACE/baseline-suite.log" || true; } | sed -E 's/ \(.*//' | sort -u > "$GITHUB_WORKSPACE/baseline-failures.txt"
          echo "Baseline failures: $(wc -l < "$GITHUB_WORKSPACE/baseline-failures.txt")"

      - name: Link the in-progress package (AISL playbook P1, `make core-link`)
        working-directory: ai-shipping-labs
        run: make core-link

      - name: System checks against the in-progress package
        working-directory: ai-shipping-labs
        run: uv run python manage.py check

      - name: Test suite against the in-progress package
        working-directory: ai-shipping-labs
        continue-on-error: true
        run: |
          set -o pipefail
          make test 2>&1 | tee "$GITHUB_WORKSPACE/linked-suite.log"

      - name: Record the linked failure set
        working-directory: ai-shipping-labs
        if: always()
        run: |
          { grep -E "^(FAIL|ERROR): " "$GITHUB_WORKSPACE/linked-suite.log" || true; } | sed -E 's/ \(.*//' | sort -u > "$GITHUB_WORKSPACE/linked-failures.txt"
          echo "Linked failures: $(wc -l < "$GITHUB_WORKSPACE/linked-failures.txt")"

      - name: Verdict — the in-progress package adds no new failures
        working-directory: ai-shipping-labs
        run: |
          comm -13 "$GITHUB_WORKSPACE/baseline-failures.txt" "$GITHUB_WORKSPACE/linked-failures.txt" > "$GITHUB_WORKSPACE/new-failures.txt" || true
          if [ -s "$GITHUB_WORKSPACE/new-failures.txt" ]; then
            echo "The in-progress package introduces failures the site does not have on its own pin:"
            cat "$GITHUB_WORKSPACE/new-failures.txt"
            exit 1
          fi
          echo "No new failures beyond the site's pinned baseline."

      - name: Restore the pinned dependency
        if: always()
        working-directory: ai-shipping-labs
        run: make core-unlink
