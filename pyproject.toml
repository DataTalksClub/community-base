[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "community-base"
version = "0.3.0"
description = "Shared Django apps for DataTalks.Club community sites"
requires-python = ">=3.13"
dependencies = [
    "apispec>=6.8,<7",
    "django>=6.0,<6.1",
    "django-allauth>=65.10,<66",
    "requests>=2.32,<3",
    "pyjwt>=2.10,<3",
    "cryptography>=46,<51",
    "markdown>=3.10,<4",
    "nh3>=0.3,<1",
    "pyyaml>=6,<7",
    "python-frontmatter>=1.1,<2",
]

[project.optional-dependencies]
django_q = ["django-q2>=1.9,<2", "croniter>=6,<7"]
ses_local = ["boto3>=1.42,<2"]
ai = ["anthropic>=0.105", "pydantic>=2.11,<3"]
zoom = []
s3 = ["boto3>=1.42,<2"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-django>=4.11,<5", "ruff>=0.12,<1", "psycopg[binary]>=3.2,<4"]

[tool.hatch.build.targets.wheel]
packages = ["community_base"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["B", "DJ", "E", "F", "I", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "testproject.settings"
pythonpath = ["."]
python_files = ["test_*.py"]
