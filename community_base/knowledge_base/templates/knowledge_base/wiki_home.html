{% extends "base.html" %}
{% block title %}Wiki{% endblock %}
{% block content %}
<main class="cb-page">
  <header class="cb-page-header">
    <h1 class="cb-page-title">Wiki</h1>
  </header>
  <section class="cb-list">
    {% for page in pages %}
      <article class="cb-card">
        <h2 class="cb-card-title"><a href="{{ page.get_absolute_url }}">{{ page.title }}</a></h2>
        {% if page.summary %}<p class="cb-card-meta">{{ page.summary }}</p>{% endif %}
      </article>
    {% empty %}
      <p class="cb-empty">No wiki pages yet.</p>
    {% endfor %}
  </section>
</main>
{% endblock %}
