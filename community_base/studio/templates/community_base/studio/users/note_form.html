{% extends "community_base/studio/base.html" %}
{% block title %}Edit member note | {{ studio_title }}{% endblock %}
{% block content %}<div class="cb-page"><header><a href="{% url 'studio_user_detail' detail_user.pk %}#member-notes">&larr; {{ detail_user }}</a><h1 class="cb-page-title mt-2">Edit member note</h1></header><form class="cb-card cb-form" method="post">{% csrf_token %}<textarea name="body" required>{{ note.body }}</textarea><select name="kind">{% for value,label in note_kinds %}<option value="{{ value }}"{% if note.kind == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select><select name="visibility">{% for value,label in note_visibilities %}<option value="{{ value }}"{% if note.visibility == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select><input name="tags" value="{{ note.tags|join:', ' }}"><button class="cb-button cb-button-primary" type="submit">Save note</button></form></div>{% endblock %}
