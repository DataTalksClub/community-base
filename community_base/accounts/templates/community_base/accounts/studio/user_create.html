{% extends "community_base/studio/base.html" %}
{% block title %}Create user{% endblock %}
{% block content %}<div class="space-y-6"><header><a class="text-sm text-muted-foreground hover:underline" href="{% url 'accounts_studio_operations' %}">&larr; Account operations</a><h1 class="cb-page-title mt-2">Create user</h1></header><form class="cb-card cb-form" method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<button class="cb-button cb-button-primary" type="submit">Create user</button></form></div>{% endblock %}
