{% extends "base.html" %}
{% block title %}Profile onboarding{% endblock %}
{% block content %}
<h1>{{ progress.flow.title }}</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{% url 'community_base_onboarding_submit' %}">{% csrf_token %}{{ form.as_p }}<button type="submit">Continue</button>{% if not step.required %}<button type="submit" name="action" value="skip">Skip</button>{% endif %}</form>
{% endblock %}
