{% extends "base.html" %}
{% block title %}Plan onboarding{% endblock %}
{% block content %}
<h1>{{ progress.flow.title }}</h1>
{% if plan.available is False %}<p role="alert">This plan step is not configured.</p>{% endif %}
<form method="post" action="{% url 'community_base_onboarding_submit' %}">{% csrf_token %}<button type="submit">Continue</button>{% if not step.required %}<button type="submit" name="action" value="skip">Skip</button>{% endif %}</form>
{% endblock %}
